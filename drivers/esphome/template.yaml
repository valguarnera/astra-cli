esphome:
  name: {{NODE_ID}}
  friendly_name: {{NODE_FRIENDLY_NAME}}

esp32:
  board: {{BOARD}}

wifi:
  ssid: "{{WIFI_SSID}}"
  password: "{{WIFI_PASSWORD}}"
  power_save_mode: none
  reboot_timeout: 0s

mqtt:
  broker: "{{MQTT_HOST}}"
  port: 1883
  username: ""
  password: ""
  discovery: true
  discovery_prefix: "homeassistant"
  topic_prefix: "astra/{{NODE_ID}}"

logger:
  level: DEBUG
  baud_rate: 115200

api:
  encryption: ""
  port: 6053

ota:
  - platform: esphome

web_server:
  port: 80

sensor:
{{SENSORS_CONFIG}}